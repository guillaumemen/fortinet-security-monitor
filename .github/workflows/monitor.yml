name: 🛡️ Fortinet PSIRT Monitor

on:
  schedule:
    - cron: "0 6 * * *"   # 08h00 CEST
    - cron: "0 11 * * *"  # 13h00 CEST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ← nécessaire pour commit le seen_cves.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run PSIRT monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Commit seen_cves.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_cves.json
          git diff --cached --quiet || git commit -m "chore: update seen_cves.json [skip ci]"
          git push
